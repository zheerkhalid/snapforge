[package]
name = "snapforge"
version = "0.1.0"
edition = "2021"
authors = ["Zheer Khalid (https://zheer.dev)"]
description = "SnapForge - a fast, native Windows screen capture, annotation and recording tool"
homepage = "https://zheer.dev"
repository = "https://github.com/zheerkhalid/snapforge"
license = "MIT"
build = "build.rs"
rust-version = "1.80"

[[bin]]
name = "SnapForge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "tga", "ico"] }
webp = { version = "0.3", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
pdf-writer = "0.12"
miniz_oxide = "0.8"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
tiny-skia = "0.11"
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
